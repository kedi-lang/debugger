[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "kedi-debugger"
version = "0.1.1"
description = "Optional stdio Debug Adapter Protocol backend for Kedi"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
# PyPI shows the Author field in full but only the first address of Author-email, so names and
# addresses are separate entries.
authors = [
    {name = "Mert Sırakaya"},
    {name = "Doğukan Yiğit Polat"},
    {email = "mert@kedi-lang.org"},
    {email = "yigit@neurograph.net"},
]
dependencies = ["kedi>=0.1.1,<0.2", "python-dotenv>=1.2.2,<2"]

[project.scripts]
kedi-debugger = "kedi_debugger.__main__:main"

[project.urls]
Documentation = "https://docs.kedi-lang.org/tooling/debugger/"
Source = "https://github.com/kedi-lang/kedi-debugger"
Tracker = "https://github.com/kedi-lang/kedi-debugger/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kedi_debugger"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.17 widened its default rule set; keep the rules this project was linted with.
select = ["E4", "E7", "E9", "F"]
